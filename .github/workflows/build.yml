
name: Build UltimateDeathSwap

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Plugin kompilieren
        run: ./gradlew clean build --no-daemon

      - name: JAR-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: UltimateDeathSwap
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
